[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ArneshBanerjee/tessera"

[workspace.dependencies]
ammonia = "4.2.3"
html-escape = "0.3.0"
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
tessera-adf = { path = "crates/tessera-adf" }
tessera-jql = { path = "crates/tessera-jql" }
base64 = "0.23.1"
form_urlencoded = "1.2.2"
clap = { version = "4.6.7", features = ["derive", "env"] }
password-auth = "1.0.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
sha2 = "0.11.1"
hex = "0.4.3"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "json"] }
uuid = { version = "1.28.0", features = ["v4"] }
axum = { version = "0.8.9", features = ["multipart"] }
jiff = "0.2.38"
logos = "0.16.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
