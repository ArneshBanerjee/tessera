[package]
name = "tessera-adf"
description = "Atlassian Document Format (ADF): the JSON rich-text format of the Jira and Confluence v3 APIs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Conversion to and from Confluence's storage format (XHTML). Needs an HTML parser.
html = ["dep:scraper"]

[dependencies]
scraper = { workspace = true, optional = true }
pulldown-cmark.workspace = true
serde.workspace = true
serde_json.workspace = true
